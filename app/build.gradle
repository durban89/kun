plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.0'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.gowhich.kun'
    compileSdk 35

    // 读取签名配置。密钥放在项目外 ~/keystores/<project>/，随私有 dotfiles 仓库同步恢复；
    // 不存在时回退到未签名构建（用 System 的 user.home 保证跨机器可用）
    def keystoreDir = file("${System.getProperty('user.home')}/keystores/kun")
    def keystorePropertiesFile = file("$keystoreDir/keystore.properties")
    def keystoreProperties = new Properties()
    def hasKeystore = keystorePropertiesFile.exists()
    if (hasKeystore) {
        keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file("$keystoreDir/${keystoreProperties['storeFile']}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.gowhich.kun"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            // 有发布 keystore 时 debug 也用它（与 release 同指纹，Google 登录一致生效）；否则用默认 debug 签名
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.2'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

}

// google-services 插件只认 app/google-services.json，构建前从 ~/keystores/kun 拷入（无则跳过，构建会照常报缺少文件）
def googleServicesFile = file("${System.getProperty('user.home')}/keystores/kun/google-services.json")
tasks.register('copyGoogleServices') {
    doLast {
        if (googleServicesFile.exists()) {
            copy {
                from googleServicesFile
                into projectDir
            }
            println "--> copied ~/keystores/kun/google-services.json"
        }
    }
}
tasks.matching { it.name.startsWith('process') && it.name.endsWith('GoogleServices') }.configureEach { task ->
    task.dependsOn 'copyGoogleServices'
}

dependencies {

    implementation 'com.google.android.material:material:1.7.0'

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.activity:activity-compose:1.7.2'


    // Compose基础库（版本由 compose-bom 统一管理）
    implementation platform('androidx.compose:compose-bom:2024.05.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation("androidx.compose.material:material-icons-extended")

    // Kotlin标准库
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0'

    implementation 'androidx.emoji2:emoji2:1.3.0'
    constraints {
        implementation('androidx.emoji2:emoji2') {
            version {
                strictly '1.3.0'
            }
        }
    }

    // Jetpack Compose Integration
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.1"

    // DataStore Preferences (本地数据持久化)
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"

    // 强制 kotlinx-serialization 使用与 Kotlin 1.9 兼容的版本
    implementation('org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.1') {
        version { strictly '1.5.1' }
    }
    implementation('org.jetbrains.kotlinx:kotlinx-serialization-core:1.5.1') {
        version { strictly '1.5.1' }
    }

    // Coil Compose 核心库（支持网络、本地图片加载）
    implementation "io.coil-kt:coil-compose:2.5.0"
    // 可选：支持 GIF/WEBP 动图（如需加载动图添加）
//    implementation "io.coil-kt:coil-gif:2.5.0"
//    implementation "io.coil-kt:coil-webp:2.5.0"

    // 播放器媒体库
    implementation("androidx.media3:media3-exoplayer:1.9.0") // 核心播放库
    implementation("androidx.media3:media3-ui:1.9.0") // UI组件（StyledPlayerView）
    implementation("androidx.media3:media3-ui-compose:1.9.0") // Compose适配
    implementation("androidx.media3:media3-common:1.9.0") // 核心基础类

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth-ktx'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // 调试工具
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}